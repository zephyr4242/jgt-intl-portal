<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .container {
      position: fixed;
      left: 0;
      right: 0;
      top: 0;
      bottom: 0;
      background-color: #2C2C2E;
    }
    .content {
      width: 900px;
      height: 500px;
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
    }
    .left-content {
      position: relative;
      display: flex;
      flex: 1;
      background: #2C2C2E url('./bg.png') no-repeat center center;
      -webkit-app-region: drag;
    }
    .left-content img {
      height: 24px;
      position: absolute;
      top: 50%;
      left: 50%;
      margin-left: -200px;
      margin-top: -236px;
    }
    .right-content {
      display: flex;
      flex: 1;
      flex-direction: column;
      text-align: center;
      font-size: 14px;
      color: #838383;
      background: url('./error.png') no-repeat center;
      position: relative;
    }
    .right-content .right-text {
      position: absolute;
      left: 0;
      top: 59%;
      text-align: center;
      width: 100%;
      user-select: none;
    }
    .right-content span {
      color: #D4B883;
      cursor: pointer;
      border-bottom: 1px solid #D4B883;
    }
    .right-content .right-control {
      text-align: right;
      width: 100%;
      padding-top: 12px;
      -webkit-app-region: drag;
    }
    .right-content .right-control img {
      width: 16px;
      margin-right: 12px;
      cursor: pointer;
      -webkit-app-region: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="content">
      <div class="left-content">
        <img src="./logo.png" alt="">
      </div>
      <div class="right-content">
        <div class="right-control">
          <img src="./minimize.svg" alt="" onclick="clickMinimize()">
          <img src="./close.svg" alt="" onclick="clickClose()">
        </div>
        <div class="right-text">
          <p style="margin-bottom: 8px;">网络连接不给力，请重试</p>
          <span onclick="clickReload()">重新加载</span>
        </div>
      </div>
    </div>
  </div>
</body>
<script>
function clickReload() {
  if (window.ipcRenderer) {
    window.ipcRenderer.send('sendReloadWindow')
  }
}
function clickMinimize() {
  if (window.ipcRenderer) {
    window.ipcRenderer.send('hide-eclient')
  }
}
function clickClose() {
  if (window.ipcRenderer) {
    window.ipcRenderer.send('updateLater', true)
  }
}

let serverUrl = ''
// 获取远端页面地址
window.ipcRenderer.on('getServerUrl', (_event, url) => {
  serverUrl = url
  checkOnLine()
})
window.ipcRenderer.send('sendGetServerUrl')

function checkOnLine () {
  if (serverUrl) {
    fetch(serverUrl, {
      method: 'GET'
    }).then(res => {
      if (!res.ok) {
        setTimeout(checkOnLine, 1000)
        return 
      }
      clickReload()
    }).catch(err => {
      setTimeout(checkOnLine, 1000)
    })
  }
}
</script>
</html>
